project:
  type: website
  output-dir: _site

website:
  title: "ggp-client"
  description: "Download, label and consolidate data from the GGP data portal."
  site-url: https://jossl95.github.io/ggp_client/
  repo-url: https://github.com/jossl95/ggp_client
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "0.2.0"  # the package version: keep in step (the docs workflow checks)
      - getting-started.qmd
      - reference.qmd
      - text: Articles
        menu:
        - ggs-ii.qmd
        - stata.qmd
        - labels.qmd
        - contract.qmd
        - ffs.qmd
    right:
      - icon: r-project
        href: https://jossl95.github.io/ggpclientR/
        aria-label: R package
      - icon: github
        href: https://github.com/jossl95/ggp_client
  page-footer:
    center: "ggp-client is not affiliated with the Generations and Gender Programme. The data stays subject to the GGP terms of use."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    css: styles.css
    include-after-body: navbar.html
