[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggp-client"
version = "0.1.0"
description = "Index and download datasets from the GGP data portal"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "py7zr>=0.20", "pandas>=1.5", "pyreadstat>=1.3", "polars>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ggp-client = "ggp_client.cli:main"

[tool.setuptools]
packages = ["ggp_client"]
